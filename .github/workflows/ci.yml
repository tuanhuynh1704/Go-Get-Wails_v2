name: Verify GoGet

on:
  push:
    branches: [master, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet Go packages
        run: go vet ./...
      - name: Staticcheck Go packages
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - name: Go tests and race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate Wails bindings
        run: wails generate module
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Build desktop application
        run: wails build
      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: GoGet-${{ runner.os }}
          path: build/bin/

  minimum-go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true
      - name: Test minimum supported Go toolchain
        run: go test -mod=readonly ./...
